<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>AI Email Assistant</title><script src="https://appsforoffice.microsoft.com/lib/1.1/hosted/office.js"></script><script defer="defer" src="/Outlook-ai/taskpane.js"></script><link href="/Outlook-ai/taskpane.css" rel="stylesheet"></head><body><section id="settings-section"><button class="settings-toggle" id="toggle-settings">⚙ Settings</button><div id="settings-panel" class="hidden"><div class="form-group"><label for="api-key">API Key</label> <input type="password" id="api-key" placeholder="sk-..." autocomplete="off"/></div><div class="form-group"><label for="base-url">Base URL</label> <input id="base-url" placeholder="https://api.openai.com/v1"/></div><div class="form-group"><label for="model">Model</label> <input id="model" placeholder="gpt-4o"/></div></div></section><section id="actions-section"><h2>Actions</h2><div class="btn-row"><button class="btn btn-primary" id="btn-summarize">Summarize</button> <button class="btn btn-primary" id="btn-reply">Reply</button> <button class="btn btn-primary" id="btn-improve">Improve</button></div></section><div id="spinner" class="hidden"><div class="spinner-ring"></div><span>Thinking…</span></div><section id="output-section"><div id="output-area" class="hidden"></div><button id="copy-btn" class="hidden">📋 Copy to clipboard</button></section><div id="status-bar"></div><div id="version-label"></div></body></html>
